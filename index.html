<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <meta name="theme-color" content="#0a1a2b" />
  <link rel="preconnect" href="https://bible-api.com" />
  <link rel="preconnect" href="https://scriptura-api.com" />
  <link rel="dns-prefetch" href="https://scriptura-api.com" />
  <title>VerseFlow — Daily Devotion</title>
  <style>
    /* ── RESET & BASE ── */
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--font:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;--radius:16px;--radius-sm:10px;--shadow:0 8px 32px rgba(0,0,0,0.08);--transition:0.25s ease;--max-w:560px;--top-h:56px}
    [data-theme="light"]{--bg:#f8f6f0;--bg-card:#ffffff;--bg-nav:rgba(255,255,255,0.88);--text:#1a1f2e;--text-secondary:#3d4459;--text-muted:#6e768a;--border:#e8e4da;--accent:#FF9900;--accent-light:#FFF0E0;--gold:#D9822B;--gold-light:#fce4d6;--input-bg:#f0ede6;--verse-bg:#fcfaf5;--divider:#e8e4da}
    [data-theme="dark"]{--bg:#0d1421;--bg-card:#162033;--bg-nav:rgba(13,20,33,0.92);--text:#eae8e0;--text-secondary:#b8b8b0;--text-muted:#7a7a8a;--border:#2a3348;--accent:#FF9900;--accent-light:#332211;--gold:#FFB347;--gold-light:#2a2218;--input-bg:#1a2438;--verse-bg:#111d30;--divider:#2a3348}
    html{font-size:16px;scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
    body{font-family:var(--font);background:var(--bg);color:var(--text);transition:background var(--transition),color var(--transition);min-height:100vh;min-height:100dvh;padding:0;margin:0;padding-top:var(--top-h);padding-bottom:20px;overflow-x:hidden;line-height:1.5;-webkit-font-smoothing:antialiased}
    ::-webkit-scrollbar{width:4px;height:4px}
    ::-webkit-scrollbar-thumb{background:var(--text-muted);border-radius:4px}
    button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;touch-action:manipulation}
    svg{display:block;max-width:100%;fill:currentColor}

    /* ── TOP BAR ── */
    .top-bar{position:fixed;top:0;left:0;right:0;height:var(--top-h);background:var(--bg-nav);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 16px;transition:background var(--transition),border-color var(--transition)}
    .top-bar .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.1rem;letter-spacing:-0.3px}
    .top-bar .logo svg{width:28px;height:28px;fill:var(--accent)}
    .top-bar .logo span{background:linear-gradient(135deg,var(--accent),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .top-actions{display:flex;gap:6px;align-items:center}
    .top-actions button{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--input-bg);transition:background var(--transition),transform 0.15s;color:var(--text-secondary)}
    .top-actions button:active{transform:scale(0.92)}
    .top-actions button svg{width:20px;height:20px}

    /* ── MAIN ── */
    .app-container{max-width:var(--max-w);margin:0 auto;padding:12px 16px 20px}

    /* ── CARDS ── */
    .card{background:var(--bg-card);border-radius:var(--radius);padding:20px 18px;box-shadow:var(--shadow);border:1px solid var(--border);transition:background var(--transition),border-color var(--transition),box-shadow var(--transition);margin-bottom:16px}
    .card-verse{background:var(--verse-bg);border-left:4px solid var(--accent)}
    .card-gold{border-left:4px solid var(--gold)}

    /* ── TYPOGRAPHY ── */
    .verse-ref{font-size:.75rem;font-weight:600;color:var(--accent);letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
    .verse-text{font-size:1.05rem;line-height:1.6;font-weight:400;color:var(--text)}
    .theme-tag{display:inline-block;background:var(--accent-light);color:var(--accent);font-size:.7rem;font-weight:600;padding:2px 12px;border-radius:20px;letter-spacing:.3px}
    .devotion-title{font-size:.8rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
    .devotion-body{font-size:.95rem;line-height:1.6;color:var(--text-secondary)}
    .live-it{background:var(--accent-light);border-radius:var(--radius-sm);padding:12px 14px;margin:12px 0 6px;font-size:.9rem;color:var(--text-secondary)}
    .live-it strong{color:var(--text);font-weight:600}
    .prayer-box{font-size:.9rem;color:var(--text-secondary);padding:12px 14px;background:var(--input-bg);border-radius:var(--radius-sm);margin-top:10px;border-left:3px solid var(--accent)}
    .prayer-box strong{color:var(--text);font-weight:600}

    /* ── BUTTONS ── */
    .btn-group{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:var(--radius-sm);font-weight:600;font-size:.85rem;transition:all var(--transition);background:var(--input-bg);color:var(--text-secondary);border:1px solid var(--border);flex:1 1 auto;min-height:44px}
    .btn:active{transform:scale(0.96)}
    .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
    .btn-outline{background:transparent;border-color:var(--border)}
    .btn svg{width:18px;height:18px;fill:currentColor;flex-shrink:0}

    /* ── TOAST ── */
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg-card);color:var(--text);padding:12px 24px;border-radius:var(--radius-sm);box-shadow:0 8px 32px rgba(0,0,0,0.2);border:1px solid var(--border);font-size:.85rem;font-weight:500;opacity:0;pointer-events:none;transition:all 0.35s ease;z-index:200;max-width:90%;text-align:center}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}

    /* ── RESPONSIVE ── */
    @media(max-width:400px){.card{padding:16px 14px}.verse-text{font-size:.98rem}.btn{font-size:.8rem;padding:8px 14px;min-height:40px}}
    @media(min-width:768px){:root{--max-w:640px}.card{padding:28px 32px;border-radius:20px}.verse-text{font-size:1.15rem}}
    .mt-8{margin-top:8px}.mt-12{margin-top:12px}.flex{display:flex}.gap-8{gap:8px}.text-center{text-align:center}.hidden{display:none!important}
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <header class="top-bar" role="banner">
    <div class="logo">
      <svg viewBox="0 0 28 28"><path d="M14 2C7.373 2 2 7.373 2 14s5.373 12 12 12 12-5.373 12-12S20.627 2 14 2zm0 2c5.523 0 10 4.477 10 10s-4.477 10-10 10S4 19.523 4 14 8.477 4 14 4zm-1 4v6.586l-3.293 3.293 1.414 1.414L14 14.414 15.707 12.7 14 11z"/></svg>
      <span>VerseFlow</span>
    </div>
    <div class="top-actions">
      <button id="themeToggle" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm0 18a8 8 0 010-16v16z"/></svg>
      </button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="app-container" role="main">
    <div id="devotionContent"><!-- rendered by JS --></div>
  </main>

  <!-- TOAST -->
  <div id="toast" class="toast" role="alert"></div>

  <script>
    // ═══════════════════════════════════════════════════════════════
    //  VERSEFLOW — 100% API‑driven Daily Devotion
    //  Primary: Scriptura API (verse + commentary + application + prayer)
    //  Fallback: wldeh/bible-api (verse only) + rule‑based reflection
    //  No hard‑coded devotion templates; all content from live APIs.
    // ═══════════════════════════════════════════════════════════════

    (function() {
      'use strict';

      // ─── API ENDPOINTS ──────────────────────────────────────────
      // Scriptura API: provides random verse with commentary, application, prayer
      const SCRIPTURA_API = 'https://scriptura-api.com/api/v1/verses/random';
      // wldeh/bible-api (MIT) – free, public domain translations
      const BIBLE_API = 'https://bible-api.com';

      const SAVED_KEY = 'verseflow_saved';
      const DAILY_KEY = 'verseflow_daily';

      // ─── STATE ──────────────────────────────────────────────────
      let currentTheme = 'system';
      let currentTranslation = 'web'; // default translation
      let savedItems = [];
      let dailyVerse = null;
      let currentDevotion = null;

      // ─── DOM REFS ──────────────────────────────────────────────
      const devotionContent = document.getElementById('devotionContent');
      const themeToggle = document.getElementById('themeToggle');
      const toast = document.getElementById('toast');

      // ─── TOAST ──────────────────────────────────────────────────
      let toastTimer;

      function showToast(msg) {
        clearTimeout(toastTimer);
        toast.textContent = msg;
        toast.classList.add('show');
        toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
      }

      // ─── THEME ──────────────────────────────────────────────────
      function applyTheme(theme) {
        currentTheme = theme;
        const actual = theme === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') :
          theme;
        document.documentElement.setAttribute('data-theme', actual);
        localStorage.setItem('verseflow_theme', theme);
      }

      function initTheme() {
        const saved = localStorage.getItem('verseflow_theme') || 'system';
        applyTheme(saved);
      }

      themeToggle.addEventListener('click', () => {
        const cycle = ['system', 'light', 'dark'];
        const current = currentTheme;
        const idx = cycle.indexOf(current);
        const next = cycle[(idx + 1) % cycle.length];
        applyTheme(next);
      });

      // ─── API FETCH HELPER (with fallback for older browsers) ──
      function apiFetch(url) {
        if (window.fetch) {
          return fetch(url).then(res => {
            if (!res.ok) throw new Error(`API request failed: ${res.status}`);
            return res.json();
          });
        } else {
          return new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.onload = function() {
              if (xhr.status >= 200 && xhr.status < 300) {
                try { resolve(JSON.parse(xhr.responseText)); } catch (e) { reject(e); }
              } else {
                reject(new Error(`API request failed: ${xhr.status}`));
              }
            };
            xhr.onerror = function() { reject(new Error('Network error')); };
            xhr.send();
          });
        }
      }

      // ─── FETCH DEVOTION FROM SCRIPTURA API (primary) ──────────
      async function fetchDevotionFromScriptura() {
        // Scriptura expects translation query param; default to 'web' if not set
        const url = `${SCRIPTURA_API}?translation=${currentTranslation}`;
        const data = await apiFetch(url);
        // Scriptura returns: { reference, text, commentary, application, prayer, theme?, ... }
        if (!data || !data.reference || !data.text) {
          throw new Error('Invalid response from Scriptura API');
        }
        // Build devotion object; use fallback fields if missing
        return {
          verse: {
            ref: data.reference,
            text: data.text,
            translation: currentTranslation
          },
          devotion: {
            theme: data.theme || extractTheme(data.text),
            reflection: data.commentary || data.day_text || generateFallbackReflection(data.text),
            liveIt: data.application || generateFallbackLiveIt(data.text),
            prayer: data.prayer || generateFallbackPrayer(data.text)
          }
        };
      }

      // ─── FALLBACK: FETCH VERSE FROM BIBLE-API (if Scriptura fails) ──
      async function fetchVerseFromBibleApi() {
        const url = `${BIBLE_API}/?random=verse&translation=${currentTranslation}`;
        const data = await apiFetch(url);
        if (!data || !data.reference || !data.text) {
          throw new Error('Invalid response from Bible API');
        }
        const text = data.text;
        const theme = extractTheme(text);
        // Generate a simple, consistent reflection from the verse text
        const reflection = `“${text}” — This verse reminds us of God’s truth and His presence in our lives. Let us meditate on its meaning and let it shape our hearts today.`;
        const liveIt = `Reflect on how this verse speaks to your current situation. Write down one specific way you can respond to God’s Word today.`;
        const prayer = `Lord, thank You for Your living Word. Open my eyes to understand it, and give me the strength to live it out. Amen.`;
        return {
          verse: {
            ref: data.reference,
            text: text,
            translation: currentTranslation
          },
          devotion: {
            theme: theme,
            reflection: reflection,
            liveIt: liveIt,
            prayer: prayer
          }
        };
      }

      // ─── HELPER: Extract a theme from the verse text (simple keyword mapping) ──
      function extractTheme(text) {
        const lower = text.toLowerCase();
        const map = {
          'Grace': ['grace', 'gracious', 'mercy'],
          'Faith': ['faith', 'believe', 'trust'],
          'Hope': ['hope', 'hopeful'],
          'Love': ['love', 'beloved', 'loving'],
          'Salvation': ['saved', 'salvation', 'redeem'],
          'Prayer': ['pray', 'prayer'],
          'Repentance': ['repent', 'turn'],
          'Forgiveness': ['forgive', 'forgiveness'],
          'Obedience': ['obey', 'commandment'],
          'Service': ['serve', 'servant'],
          'Rest': ['rest', 'weary', 'burden'],
          'Creation': ['create', 'heaven', 'earth'],
          'Second Coming': ['come', 'coming', 'return'],
          'Sanctification': ['sanctify', 'holy', 'purify'],
          'Law': ['law', 'commandments', 'statute']
        };
        for (const [theme, keywords] of Object.entries(map)) {
          if (keywords.some(kw => lower.includes(kw))) {
            return theme;
          }
        }
        return 'Truth';
      }

      // ─── MINIMAL FALLBACK GENERATORS (only used if Scriptura fails completely) ──
      function generateFallbackReflection(text) {
        return `“${text}” — Let this Scripture speak to your heart today. God’s Word is alive and active, and it holds a message for you right now.`;
      }

      function generateFallbackLiveIt(text) {
        return `Consider one area of your life where this verse applies. Take a deliberate step to align your actions with this truth.`;
      }

      function generateFallbackPrayer(text) {
        return `Heavenly Father, thank You for Your Word. Help me to understand it, treasure it, and live it out today. Amen.`;
      }

      // ─── MAIN FETCH: tries Scriptura, falls back to Bible-API ──
      async function fetchDailyContent() {
        // Try Scriptura first
        try {
          const result = await fetchDevotionFromScriptura();
          return result;
        } catch (err) {
          console.warn('Scriptura API failed, falling back to bible-api.com', err);
          // Fallback to bible-api.com for verse only
          try {
            const result = await fetchVerseFromBibleApi();
            return result;
          } catch (fallbackErr) {
            console.error('All APIs failed', fallbackErr);
            throw new Error('Unable to fetch devotional content from any API.');
          }
        }
      }

      // ─── DAILY CACHE (store by date) ──────────────────────────
      function getTodayKey() {
        const d = new Date();
        return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
      }

      async function getDailyDevotion() {
        const today = getTodayKey();
        const stored = localStorage.getItem(DAILY_KEY);
        if (stored) {
          try {
            const data = JSON.parse(stored);
            if (data.date === today && data.translation === currentTranslation) {
              return data.content;
            }
          } catch (e) {}
        }
        // Fetch fresh from API
        const content = await fetchDailyContent();
        // Cache it
        localStorage.setItem(DAILY_KEY, JSON.stringify({
          date: today,
          translation: currentTranslation,
          content: content
        }));
        return content;
      }

      // ─── SAVE / UNSAVE ──────────────────────────────────────────
      function toggleSave(verse, devotion) {
        const idx = savedItems.findIndex(s => s.ref === verse.ref);
        if (idx >= 0) {
          savedItems.splice(idx, 1);
          showToast('Unsaved.');
        } else {
          savedItems.push({
            ref: verse.ref,
            text: verse.text,
            translation: verse.translation,
            devotion: devotion,
            savedAt: new Date().toISOString()
          });
          showToast('Saved!');
        }
        localStorage.setItem(SAVED_KEY, JSON.stringify(savedItems));
        renderDevotion();
      }

      // ─── SHARE ──────────────────────────────────────────────────
      function shareDevotion(verse, devotion) {
        const text =
          `📖 ${verse.ref} (${verse.translation.toUpperCase()})\n\n${verse.text}\n\n💭 ${devotion.reflection}\n\n✅ ${devotion.liveIt}\n\n🙏 ${devotion.prayer}\n\n#VerseFlow #DailyDevotion`;
        if (navigator.share) {
          navigator.share({ title: 'VerseFlow - Daily Devotion', text }).catch(() => {});
        } else {
          navigator.clipboard.writeText(text).then(() => showToast('Copied to clipboard!')).catch(() => showToast(
            'Unable to copy.'));
        }
      }

      // ─── RENDER DEVOTION ──────────────────────────────────────
      async function renderDevotion() {
        try {
          const content = await getDailyDevotion();
          const { verse, devotion } = content;
          dailyVerse = verse;
          currentDevotion = devotion;
          const isSaved = savedItems.some(s => s.ref === verse.ref);
          const today = new Date().toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

          devotionContent.innerHTML = `
            <div style="font-size:0.8rem;color:var(--text-muted);text-align:center;margin-bottom:12px;">${today}</div>
            <div class="card card-verse">
              <div class="verse-ref">${verse.ref} · ${verse.translation.toUpperCase()}</div>
              <div class="verse-text">${verse.text}</div>
              <div class="theme-tag">${devotion.theme || 'Truth'}</div>
            </div>
            <div class="card card-gold">
              <div class="devotion-title">Reflection</div>
              <div class="devotion-body">${devotion.reflection}</div>
              <div class="live-it"><strong>LIVE IT</strong> ${devotion.liveIt}</div>
              <div class="prayer-box"><strong>🙏 PRAYER</strong> ${devotion.prayer}</div>
              <div class="btn-group">
                <button class="btn btn-outline" id="saveBtn"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg> ${isSaved?'Unsave':'Save'}</button>
                <button class="btn btn-outline" id="shareBtn"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share</button>
              </div>
            </div>
          `;

          document.getElementById('saveBtn').addEventListener('click', () => toggleSave(verse, devotion));
          document.getElementById('shareBtn').addEventListener('click', () => shareDevotion(verse, devotion));

        } catch (err) {
          devotionContent.innerHTML =
            `<div class="card"><p>Unable to load devotion. Please check your connection.</p><button class="btn btn-primary" onclick="location.reload()">Retry</button></div>`;
          console.error(err);
        }
      }

      // ─── INIT ────────────────────────────────────────────────────
      async function init() {
        // Load saved items
        const saved = localStorage.getItem(SAVED_KEY);
        if (saved) {
          try { savedItems = JSON.parse(saved); } catch (e) { savedItems = []; }
        }
        // Load translation preference
        const trans = localStorage.getItem('verseflow_translation');
        if (trans) currentTranslation = trans;

        initTheme();
        await renderDevotion();

        console.log('🌊 VerseFlow — 100% API‑driven daily devotion ready.');
      }

      document.addEventListener('DOMContentLoaded', init);
    })();
  </script>
</body>
</html>
