<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <meta name="theme-color" content="#0a1a2b" />
  <link rel="preconnect" href="https://bible-api.com" />
  <link rel="dns-prefetch" href="https://bible-api.com" />
  <title>VerseFlow — Daily Devotion</title>
  <style>
    /* ── RESET & BASE ── */
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--font:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;--radius:16px;--radius-sm:10px;--shadow:0 8px 32px rgba(0,0,0,0.08);--transition:0.25s ease;--max-w:560px;--top-h:56px}
    [data-theme="light"]{--bg:#f8f6f0;--bg-card:#ffffff;--bg-nav:rgba(255,255,255,0.88);--text:#1a1f2e;--text-secondary:#3d4459;--text-muted:#6e768a;--border:#e8e4da;--accent:#FF9900;--accent-light:#FFF0E0;--gold:#D9822B;--gold-light:#fce4d6;--input-bg:#f0ede6;--verse-bg:#fcfaf5;--divider:#e8e4da}
    [data-theme="dark"]{--bg:#0d1421;--bg-card:#162033;--bg-nav:rgba(13,20,33,0.92);--text:#eae8e0;--text-secondary:#b8b8b0;--text-muted:#7a7a8a;--border:#2a3348;--accent:#FF9900;--accent-light:#332211;--gold:#FFB347;--gold-light:#2a2218;--input-bg:#1a2438;--verse-bg:#111d30;--divider:#2a3348}
    html{font-size:16px;scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
    body{font-family:var(--font);background:var(--bg);color:var(--text);transition:background var(--transition),color var(--transition);min-height:100vh;min-height:100dvh;padding:0;margin:0;padding-top:var(--top-h);padding-bottom:20px;overflow-x:hidden;line-height:1.5;-webkit-font-smoothing:antialiased}
    ::-webkit-scrollbar{width:4px;height:4px}
    ::-webkit-scrollbar-thumb{background:var(--text-muted);border-radius:4px}
    button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;touch-action:manipulation}
    svg{display:block;max-width:100%;fill:currentColor}

    /* ── TOP BAR ── */
    .top-bar{position:fixed;top:0;left:0;right:0;height:var(--top-h);background:var(--bg-nav);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 16px;transition:background var(--transition),border-color var(--transition)}
    .top-bar .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.1rem;letter-spacing:-0.3px}
    .top-bar .logo svg{width:28px;height:28px;fill:var(--accent)}
    .top-bar .logo span{background:linear-gradient(135deg,var(--accent),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .top-actions{display:flex;gap:6px;align-items:center}
    .top-actions button{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--input-bg);transition:background var(--transition),transform 0.15s;color:var(--text-secondary)}
    .top-actions button:active{transform:scale(0.92)}
    .top-actions button svg{width:20px;height:20px}

    /* ── MAIN ── */
    .app-container{max-width:var(--max-w);margin:0 auto;padding:12px 16px 20px}

    /* ── CARDS ── */
    .card{background:var(--bg-card);border-radius:var(--radius);padding:20px 18px;box-shadow:var(--shadow);border:1px solid var(--border);transition:background var(--transition),border-color var(--transition),box-shadow var(--transition);margin-bottom:16px}
    .card-verse{background:var(--verse-bg);border-left:4px solid var(--accent)}
    .card-gold{border-left:4px solid var(--gold)}

    /* ── TYPOGRAPHY ── */
    .verse-ref{font-size:.75rem;font-weight:600;color:var(--accent);letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
    .verse-text{font-size:1.05rem;line-height:1.6;font-weight:400;color:var(--text)}
    .theme-tag{display:inline-block;background:var(--accent-light);color:var(--accent);font-size:.7rem;font-weight:600;padding:2px 12px;border-radius:20px;letter-spacing:.3px}
    .devotion-title{font-size:.8rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
    .devotion-body{font-size:.95rem;line-height:1.6;color:var(--text-secondary)}
    .punchline{font-size:1.05rem;font-weight:600;color:var(--gold);line-height:1.4;padding:12px 0 4px;border-top:1px solid var(--divider);margin-top:12px;font-style:italic}
    .live-it{background:var(--accent-light);border-radius:var(--radius-sm);padding:12px 14px;margin:12px 0 6px;font-size:.9rem;color:var(--text-secondary)}
    .live-it strong{color:var(--text);font-weight:600}
    .prayer-box{font-size:.9rem;color:var(--text-secondary);padding:12px 14px;background:var(--input-bg);border-radius:var(--radius-sm);margin-top:10px;border-left:3px solid var(--accent)}
    .prayer-box strong{color:var(--text);font-weight:600}

    /* ── BUTTONS ── */
    .btn-group{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:var(--radius-sm);font-weight:600;font-size:.85rem;transition:all var(--transition);background:var(--input-bg);color:var(--text-secondary);border:1px solid var(--border);flex:1 1 auto;min-height:44px}
    .btn:active{transform:scale(0.96)}
    .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
    .btn-outline{background:transparent;border-color:var(--border)}
    .btn svg{width:18px;height:18px;fill:currentColor;flex-shrink:0}

    /* ── TOAST ── */
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg-card);color:var(--text);padding:12px 24px;border-radius:var(--radius-sm);box-shadow:0 8px 32px rgba(0,0,0,0.2);border:1px solid var(--border);font-size:.85rem;font-weight:500;opacity:0;pointer-events:none;transition:all 0.35s ease;z-index:200;max-width:90%;text-align:center}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}

    /* ── RESPONSIVE ── */
    @media(max-width:400px){.card{padding:16px 14px}.verse-text{font-size:.98rem}.btn{font-size:.8rem;padding:8px 14px;min-height:40px}}
    @media(min-width:768px){:root{--max-w:640px}.card{padding:28px 32px;border-radius:20px}.verse-text{font-size:1.15rem}}
    .mt-8{margin-top:8px}.mt-12{margin-top:12px}.flex{display:flex}.gap-8{gap:8px}.text-center{text-align:center}.hidden{display:none!important}
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <header class="top-bar" role="banner">
    <div class="logo">
      <svg viewBox="0 0 28 28"><path d="M14 2C7.373 2 2 7.373 2 14s5.373 12 12 12 12-5.373 12-12S20.627 2 14 2zm0 2c5.523 0 10 4.477 10 10s-4.477 10-10 10S4 19.523 4 14 8.477 4 14 4zm-1 4v6.586l-3.293 3.293 1.414 1.414L14 14.414 15.707 12.7 14 11z"/></svg>
      <span>VerseFlow</span>
    </div>
    <div class="top-actions">
      <button id="themeToggle" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm0 18a8 8 0 010-16v16z"/></svg>
      </button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="app-container" role="main">
    <div id="devotionContent"><!-- rendered by JS --></div>
  </main>

  <!-- TOAST -->
  <div id="toast" class="toast" role="alert"></div>

  <script>
    // ═══════════════════════════════════════════════════════════════
    //  VERSEFLOW — Daily Devotion (Thematically Aligned)
    //  Picks devotion based on keywords in the verse text itself.
    // ═══════════════════════════════════════════════════════════════

    (function() {
      'use strict';

      // ─── CONSTANTS ──────────────────────────────────────────────
      const API_BASE = 'https://bible-api.com';
      const SAVED_KEY = 'verseflow_saved';
      const DAILY_KEY = 'verseflow_daily';

      // ─── STATE ──────────────────────────────────────────────────
      let currentTheme = 'system';
      let currentTranslation = 'web';
      let savedItems = [];
      let dailyVerse = null;
      let currentDevotion = null;

      // ─── DOM REFS ──────────────────────────────────────────────
      const devotionContent = document.getElementById('devotionContent');
      const themeToggle = document.getElementById('themeToggle');
      const toast = document.getElementById('toast');

      // ─── TOAST ──────────────────────────────────────────────────
      let toastTimer;

      function showToast(msg) {
        clearTimeout(toastTimer);
        toast.textContent = msg;
        toast.classList.add('show');
        toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
      }

      // ─── THEME ──────────────────────────────────────────────────
      function applyTheme(theme) {
        currentTheme = theme;
        const actual = theme === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') :
          theme;
        document.documentElement.setAttribute('data-theme', actual);
        localStorage.setItem('verseflow_theme', theme);
      }

      function initTheme() {
        const saved = localStorage.getItem('verseflow_theme') || 'system';
        applyTheme(saved);
      }

      themeToggle.addEventListener('click', () => {
        const cycle = ['system', 'light', 'dark'];
        const current = currentTheme;
        const idx = cycle.indexOf(current);
        const next = cycle[(idx + 1) % cycle.length];
        applyTheme(next);
      });

      // ─── API HELPERS ────────────────────────────────────────────
      function apiFetch(url) {
        if (window.fetch) {
          return fetch(url).then(res => {
            if (!res.ok) throw new Error('API request failed');
            return res.json();
          });
        } else {
          return new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.onload = function() {
              if (xhr.status >= 200 && xhr.status < 300) {
                try { resolve(JSON.parse(xhr.responseText)); } catch (e) { reject(e); }
              } else {
                reject(new Error('API request failed'));
              }
            };
            xhr.onerror = function() { reject(new Error('Network error')); };
            xhr.send();
          });
        }
      }

      async function fetchRandom(translation) {
        const url = `${API_BASE}/?random=verse&translation=${translation}`;
        return await apiFetch(url);
      }

      // ─── DAILY VERSE (cached by date) ──────────────────────────
      function getTodayKey() {
        const d = new Date();
        return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
      }

      async function getDailyVerse() {
        const today = getTodayKey();
        const stored = localStorage.getItem(DAILY_KEY);
        if (stored) {
          try {
            const data = JSON.parse(stored);
            if (data.date === today && data.translation === currentTranslation) {
              dailyVerse = data.verse;
              return dailyVerse;
            }
          } catch (e) {}
        }
        try {
          const data = await fetchRandom(currentTranslation);
          const verse = {
            ref: data.reference,
            text: data.text,
            translation: currentTranslation,
            date: today
          };
          localStorage.setItem(DAILY_KEY, JSON.stringify({ date: today, translation: currentTranslation, verse }));
          dailyVerse = verse;
          return verse;
        } catch (e) {
          showToast('Error fetching daily verse. Please try again.');
          return null;
        }
      }

      // ─── DEVOTION TEMPLATES (each has a theme and content) ─────
      const DEVOTION_TEMPLATES = [{
        theme: 'Grace',
        body: 'God’s grace is unearned and boundless. It reaches us in our lowest moments and lifts us to new life. “For by grace you have been saved through faith” (Ephesians 2:8).',
        live: 'Reflect on a time you experienced grace. Share that story with someone today.',
        punchline: 'Grace is the heartbeat of heaven, beating for you.',
        prayer: 'Lord, thank you for your amazing grace. Help me to extend that grace to others today. Amen.'
      }, {
        theme: 'Salvation',
        body: 'Salvation is not a reward for good works but a gift received through faith in Jesus Christ. “For God so loved the world that he gave his one and only Son” (John 3:16).',
        live: 'Thank God for the gift of salvation. Write a short prayer of gratitude.',
        punchline: 'Saved by grace, kept by faith, sealed by love.',
        prayer: 'Father, I receive your gift of salvation with a humble heart. Lead me in your ways. Amen.'
      }, {
        theme: 'Faith',
        body: 'Faith is trusting God even when the path is unclear. It is the assurance of things hoped for, the conviction of things not seen (Hebrews 11:1).',
        live: 'Take one step of faith today in an area you’ve been hesitant.',
        punchline: 'Faith turns whispers into shouts of victory.',
        prayer: 'Lord, increase my faith. Help me to trust you even when I cannot see the way. Amen.'
      }, {
        theme: 'Hope',
        body: 'Hope anchors our soul in the promises of God. It looks beyond the present to the eternal. “We have this hope as an anchor for the soul, firm and secure” (Hebrews 6:19).',
        live: 'Encourage someone with a word of hope today.',
        punchline: 'Hope is the dawn that breaks the darkest night.',
        prayer: 'God of hope, fill me with your peace and joy as I trust in you. Amen.'
      }, {
        theme: 'Love',
        body: 'God’s love is unconditional and transformative. It compels us to love others as He has loved us. “We love because he first loved us” (1 John 4:19).',
        live: 'Perform an act of kindness for someone without expecting anything in return.',
        punchline: 'Love is the language God speaks fluently.',
        prayer: 'Heavenly Father, teach me to love as you love. Let your love flow through me to others. Amen.'
      }, {
        theme: 'Obedience',
        body: 'Obedience is not legalism but love in action. Jesus said, “If you love me, keep my commandments” (John 14:15).',
        live: 'Identify one command of God you struggle with and commit to obeying it today.',
        punchline: 'Obedience is the fruit of a heart that loves.',
        prayer: 'Lord, give me a willing heart to obey you, not out of duty, but out of love. Amen.'
      }, {
        theme: 'Prayer',
        body: 'Prayer is our lifeline to God. It is not about eloquent words but about an honest heart. “Pray without ceasing” (1 Thessalonians 5:17).',
        live: 'Spend 10 extra minutes in prayer today, listening for God’s voice.',
        punchline: 'Prayer turns ordinary moments into holy encounters.',
        prayer: 'Father, teach me to pray with sincerity and listen for your voice. Amen.'
      }, {
        theme: 'Repentance',
        body: 'Repentance is turning from sin and turning to God. It is the first step toward renewal. “Repent, for the kingdom of heaven is at hand” (Matthew 4:17).',
        live: 'Confess one sin to God and accept His forgiveness fully.',
        punchline: 'Repentance is the doorway to a new beginning.',
        prayer: 'Merciful God, I repent of my sins. Cleanse me and restore me. Amen.'
      }, {
        theme: 'Forgiveness',
        body: 'Forgiveness releases the burden of bitterness. It mirrors the forgiveness we have received in Christ. “Be kind and compassionate to one another, forgiving each other, just as in Christ God forgave you” (Ephesians 4:32).',
        live: 'Forgive someone who has hurt you, even if only in your heart.',
        punchline: 'Forgiveness is the key that unlocks your own prison.',
        prayer: 'Lord, help me to forgive as you have forgiven me. Release any bitterness in my heart. Amen.'
      }, {
        theme: 'Service',
        body: 'Service is an expression of love. Jesus came to serve, not to be served. “For even the Son of Man did not come to be served, but to serve” (Mark 10:45).',
        live: 'Find a practical way to serve someone in need today.',
        punchline: 'Service is love in work clothes.',
        prayer: 'Jesus, show me how to serve others with humility and love. Amen.'
      }, {
        theme: 'Discipleship',
        body: 'Discipleship is the journey of following Jesus daily. It involves learning, growing, and sharing. “Go and make disciples of all nations” (Matthew 28:19).',
        live: 'Share something you’ve learned about Jesus with a friend.',
        punchline: 'Discipleship is a walk, not a sprint.',
        prayer: 'Lord, make me a faithful disciple who follows you and leads others to you. Amen.'
      }, {
        theme: 'Rest',
        body: 'Rest is a gift from God. He invites us to find rest in Him. “Come to me, all you who are weary and burdened, and I will give you rest” (Matthew 11:28).',
        live: 'Set aside time today to rest in God’s presence, free from distractions.',
        punchline: 'Rest in the Lord, and be renewed.',
        prayer: 'Father, I come to you with my burdens. Give me rest for my soul. Amen.'
      }, {
        theme: 'Creation',
        body: 'Creation reveals God’s power and love. We are stewards of His handiwork. “In the beginning God created the heavens and the earth” (Genesis 1:1).',
        live: 'Spend time in nature and praise the Creator for His works.',
        punchline: 'Creation is a love letter from the Creator.',
        prayer: 'Creator God, I marvel at your works. Help me to care for your creation. Amen.'
      }, {
        theme: 'Second Coming',
        body: 'Jesus is coming again to take us home. This hope shapes our lives and our witness. “Behold, I am coming soon” (Revelation 22:12).',
        live: 'Live today with the confidence that Jesus is coming soon.',
        punchline: 'His return is our blessed hope.',
        prayer: 'Come, Lord Jesus. May your return be my hope and my motivation to live for you. Amen.'
      }, {
        theme: 'Sanctification',
        body: 'Sanctification is the work of God’s grace in us, transforming us into the likeness of Christ. “May the God of peace himself sanctify you completely” (1 Thessalonians 5:23).',
        live: 'Ask the Holy Spirit to reveal areas in your life that need transformation.',
        punchline: 'Sanctification is a journey of becoming more like Jesus.',
        prayer: 'Holy Spirit, work in me to make me more like Christ. Purify my heart. Amen.'
      }, {
        theme: 'Law',
        body: 'God’s law is a reflection of His character. It guides us in the path of righteousness. “The law of the LORD is perfect, refreshing the soul” (Psalm 19:7).',
        live: 'Meditate on one of the Ten Commandments and apply it today.',
        punchline: 'The law is a lamp to our feet.',
        prayer: 'Lord, help me to love your law and to walk in your ways. Amen.'
      }];

      // ─── KEYWORD → THEME MAPPING ──────────────────────────────
      const THEME_KEYWORDS = {
        'grace': ['grace', 'gracious', 'mercy', 'merciful', 'kindness'],
        'salvation': ['saved', 'salvation', 'redeem', 'redeemer', 'deliver'],
        'faith': ['faith', 'believe', 'trust', 'confidence'],
        'hope': ['hope', 'hopeful', 'expect'],
        'love': ['love', 'beloved', 'loving', 'charity'],
        'obedience': ['obey', 'obedience', 'commandment', 'law', 'keep'],
        'prayer': ['pray', 'prayer', 'intercede'],
        'repentance': ['repent', 'repentance', 'turn', 'forsake'],
        'forgiveness': ['forgive', 'forgiveness', 'pardon'],
        'service': ['serve', 'servant', 'service', 'minister'],
        'discipleship': ['disciple', 'follow', 'learn'],
        'rest': ['rest', 'weary', 'burden', 'refresh'],
        'creation': ['create', 'creation', 'heaven', 'earth', 'world', 'made'],
        'second coming': ['come', 'coming', 'return', 'appear'],
        'sanctification': ['sanctify', 'sanctification', 'holy', 'purify', 'cleanse'],
        'law': ['law', 'commandments', 'statute', 'precept']
      };

      // ─── SELECT DEVOTION BASED ON VERSE TEXT ──────────────────
      function getDevotionForVerse(verseRef, verseText) {
        const lowerText = verseText.toLowerCase();
        let matchedTheme = null;

        // Search for keywords in the verse text
        for (const [theme, keywords] of Object.entries(THEME_KEYWORDS)) {
          if (keywords.some(kw => lowerText.includes(kw))) {
            matchedTheme = theme;
            break;
          }
        }

        // If a theme is found, pick the first template with that theme
        if (matchedTheme) {
          const template = DEVOTION_TEMPLATES.find(t => t.theme.toLowerCase() === matchedTheme);
          if (template) return template;
        }

        // Fallback: use hash-based selection (old method)
        const seed = verseRef.split(' ').join('').split(':').join('');
        let hash = 0;
        for (let i = 0; i < seed.length; i++) {
          hash = (hash << 5) - hash + seed.charCodeAt(i);
          hash = hash & hash;
        }
        const idx = Math.abs(hash) % DEVOTION_TEMPLATES.length;
        return DEVOTION_TEMPLATES[idx];
      }

      // ─── SAVE / UNSAVE ──────────────────────────────────────────
      function toggleSave(verse, devotion) {
        const idx = savedItems.findIndex(s => s.ref === verse.ref);
        if (idx >= 0) {
          savedItems.splice(idx, 1);
          showToast('Unsaved.');
        } else {
          savedItems.push({
            ref: verse.ref,
            text: verse.text,
            translation: verse.translation,
            devotion: devotion,
            savedAt: new Date().toISOString()
          });
          showToast('Saved!');
        }
        localStorage.setItem(SAVED_KEY, JSON.stringify(savedItems));
        renderDevotion();
      }

      // ─── SHARE ──────────────────────────────────────────────────
      function shareDevotion(verse, devotion) {
        const text =
          `📖 ${verse.ref} (${verse.translation.toUpperCase()})\n\n${verse.text}\n\n💭 ${devotion.body}\n\n✅ ${devotion.live}\n\n✨ “${devotion.punchline}”\n\n🙏 ${devotion.prayer}\n\n#VerseFlow #DailyDevotion`;
        if (navigator.share) {
          navigator.share({ title: 'VerseFlow - Daily Devotion', text }).catch(() => {});
        } else {
          navigator.clipboard.writeText(text).then(() => showToast('Copied to clipboard!')).catch(() => showToast(
            'Unable to copy.'));
        }
      }

      // ─── RENDER DEVOTION ──────────────────────────────────────
      async function renderDevotion() {
        const verse = await getDailyVerse();
        if (!verse) {
          devotionContent.innerHTML =
            `<div class="card"><p>Unable to load devotion. Please check your connection.</p><button class="btn btn-primary" onclick="location.reload()">Retry</button></div>`;
          return;
        }
        // Pass verse text for keyword matching
        const devotion = getDevotionForVerse(verse.ref, verse.text);
        currentDevotion = devotion;
        const isSaved = savedItems.some(s => s.ref === verse.ref);
        const today = new Date().toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        devotionContent.innerHTML = `
          <div style="font-size:0.8rem;color:var(--text-muted);text-align:center;margin-bottom:12px;">${today}</div>
          <div class="card card-verse">
            <div class="verse-ref">${verse.ref} · ${verse.translation.toUpperCase()}</div>
            <div class="verse-text">${verse.text}</div>
            <div class="theme-tag">${devotion.theme}</div>
          </div>
          <div class="card card-gold">
            <div class="devotion-title">Reflection</div>
            <div class="devotion-body">${devotion.body}</div>
            <div class="live-it"><strong>LIVE IT</strong> ${devotion.live}</div>
            <div class="punchline">“${devotion.punchline}”</div>
            <div class="prayer-box"><strong>🙏 PRAYER</strong> ${devotion.prayer}</div>
            <div class="btn-group">
              <button class="btn btn-outline" id="saveBtn"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg> ${isSaved?'Unsave':'Save'}</button>
              <button class="btn btn-outline" id="shareBtn"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg> Share</button>
            </div>
          </div>
        `;

        document.getElementById('saveBtn').addEventListener('click', () => toggleSave(verse, devotion));
        document.getElementById('shareBtn').addEventListener('click', () => shareDevotion(verse, devotion));
      }

      // ─── INIT ────────────────────────────────────────────────────
      async function init() {
        const saved = localStorage.getItem(SAVED_KEY);
        if (saved) {
          try { savedItems = JSON.parse(saved); } catch (e) { savedItems = []; }
        }
        const trans = localStorage.getItem('verseflow_translation');
        if (trans) currentTranslation = trans;

        initTheme();
        await renderDevotion();

        console.log('🌊 VerseFlow — Thematically unified daily devotion ready.');
      }

      document.addEventListener('DOMContentLoaded', init);
    })();
  </script>
</body>
